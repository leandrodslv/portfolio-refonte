name: CI failure → issue

# Quand la CI échoue sur `main` ou `dev`, ouvre une issue `ai-fix` avec le lien du run
# et les jobs fautifs. Rien n'est créé pour les échecs de PR (bruit).
# Un workflow `workflow_run` s'exécute depuis la version du fichier sur la branche
# par défaut : il ne se déclenche qu'une fois fusionné sur `main`.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  open-issue:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.head_branch == 'main' ||
      github.event.workflow_run.head_branch == 'dev')
    runs-on: ubuntu-latest
    steps:
      - name: Ouvrir l'issue ai-fix, sauf si elle existe déjà pour ce commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:7}"
          TITLE="ci: échec sur ${BRANCH} (${SHORT_SHA})"

          if gh issue list --state open --label ai-fix --search "${SHORT_SHA}" \
               --json title --jq '.[].title' | grep -qF "${SHORT_SHA}"; then
            echo "Issue déjà ouverte pour ${SHORT_SHA}."
            exit 0
          fi

          gh run view "$RUN_ID" --json jobs \
            --jq '.jobs[] | select(.conclusion=="failure") | "- \(.name)"' > failed.txt || true
          [ -s failed.txt ] || echo "- (voir le run)" > failed.txt

          {
            echo "La CI a échoué sur \`${BRANCH}\` au commit \`${SHORT_SHA}\`."
            echo
            echo "**Run** : ${RUN_URL}"
            echo
            echo "**Jobs en échec :**"
            cat failed.txt
            echo
            echo "---"
            echo "La correction repart verte (\`npm test\`, \`npm run lint\`, \`npm run typecheck\`) et, pour un \`fix:\`, ajoute un test qui échoue avant le correctif."
          } > body.md

          gh issue create --title "$TITLE" --label ai-fix --body-file body.md
